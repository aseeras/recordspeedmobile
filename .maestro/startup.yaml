appId: com.recordspeed.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Next"
    timeout: 180000
- takeScreenshot: 01-onboarding-step-1
- tapOn: "Next"
- takeScreenshot: 02-onboarding-step-2
- tapOn: "Next"
- takeScreenshot: 03-onboarding-step-3
- tapOn: "Get started"
- extendedWaitUntil:
    visible: "Sign in or sign up to start your request"
    timeout: 60000
- takeScreenshot: 04-zero-state
- tapOn: "Sign In"
- extendedWaitUntil:
    visible: "Or use your email and password"
    timeout: 60000
# Give a render-time crash a moment to surface, then make sure we're still here.
- waitForAnimationToEnd
- assertVisible: "Or use your email and password"
- takeScreenshot: 05-sign-in
# Returning user: onboarding is already done, so the app must go straight
# to the Sign In screen instead of a blank page.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Sign in or sign up to start your request"
    timeout: 120000
- takeScreenshot: 06-relaunch-returning-user
