name: iOS Simulator Build
on:
  push:
    branches-ignore: [simulator-screenshots]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_API_BASE_URL: https://api.recordspeed.com
      EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_IOS_OAUTH_CLIENT_ID: ${{ vars.EXPO_PUBLIC_IOS_OAUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install pods
        # Retry: pod install clones SDKs such as stripe-ios from GitHub, and a
        # dropped connection on the runner otherwise fails the whole build.
        run: |
          cd ios
          for attempt in 1 2 3; do
            pod install && exit 0
            echo "pod install failed (attempt $attempt), retrying in 20s..."
            sleep 20
          done
          exit 1

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/RecordSpeed.xcworkspace \
            -scheme RecordSpeed \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -200

      - name: Package app
        run: |
          APP=$(find build/Build/Products -name 'RecordSpeed.app' -maxdepth 3 | head -1)
          ditto -c -k --keepParent "$APP" RecordSpeed.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RecordSpeed-simulator
          path: RecordSpeed.app.zip

      - name: Build DMG
        run: |
          APP=$(find build/Build/Products -name 'RecordSpeed.app' -maxdepth 3 | head -1)
          mkdir -p dmg && ditto "$APP" dmg/RecordSpeed.app
          cat > dmg/README.txt <<'TXT'
          Record Speed (iOS Simulator build)

          1. Open Xcode > Open Developer Tool > Simulator and wait for the iPhone home screen.
          2. Drag RecordSpeed.app from this window onto the simulated iPhone.
          3. Tap the Record Speed icon.

          If an older version is installed, remove it first in Terminal:
            xcrun simctl uninstall booted com.ingeniousagency.record-speed-mobile
          TXT
          hdiutil create -volname RecordSpeed -srcfolder dmg -ov -format UDZO RecordSpeed.dmg
          ls -lh RecordSpeed.dmg

      # Rolling release so the latest .dmg is always at the same download URL:
      # https://github.com/<owner>/<repo>/releases/download/simulator-latest/RecordSpeed.dmg
      - name: Publish DMG to the simulator-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete simulator-latest --yes --cleanup-tag || true
          gh release create simulator-latest RecordSpeed.dmg \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "iOS Simulator build (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. Open the .dmg and drag RecordSpeed.app onto the iOS Simulator."

      - name: Launch in newest iOS Simulator and screenshot
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x['isAvailable']]; r.sort(key=lambda x: [int(p) for p in x['version'].split('.')]); print(r[-1]['identifier'])")
          echo "Runtime: $RUNTIME"
          UDID=$(xcrun simctl create RecordSpeedTest "iPhone 16 Pro" "$RUNTIME" 2>/dev/null || xcrun simctl create RecordSpeedTest "$(xcrun simctl list devicetypes | grep -m1 -o 'iPhone [^(]*Pro' | sed 's/ *$//')" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/Build/Products -name 'RecordSpeed.app' -maxdepth 3 | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.ingeniousagency.record-speed-mobile
          mkdir -p screenshots
          sleep 15
          xcrun simctl io "$UDID" screenshot screenshots/launch-15s.png
          sleep 45
          xcrun simctl io "$UDID" screenshot screenshots/launch-60s.png
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "RecordSpeed"' --style compact > screenshots/app-log.txt || true
          { xcodebuild -version; echo "Simulator runtime: $RUNTIME"; } > screenshots/versions.txt
          cat screenshots/versions.txt
          grep -iE "error|exception|fatal|crash" screenshots/app-log.txt | tail -50 || true
          echo "$UDID" > udid.txt

      - name: Tap through startup flow with Maestro
        run: |
          set -o pipefail
          curl -Ls "https://get.maestro.mobile.dev" | bash
          export PATH="$PATH:$HOME/.maestro/bin"
          UDID=$(cat udid.txt)
          status=0
          maestro --device "$UDID" test .maestro/startup.yaml --test-output-dir maestro-output 2>&1 | tee screenshots/maestro.txt || status=$?
          find . "$HOME/.maestro" -name '0*.png' -not -path './screenshots/*' -exec cp {} screenshots/ \; 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 5m --predicate 'process == "RecordSpeed"' --style compact > screenshots/app-log-flow.txt || true
          grep -E "javascript\]|Fatal|crash" screenshots/app-log-flow.txt | tail -40 || true
          if grep -qE "RCTFatal|Unhandled JS Exception|must be defined to use" screenshots/app-log-flow.txt; then
            echo "::error::The app hit a fatal JavaScript error during the flow"
            status=1
          fi
          exit $status

      - name: Publish screenshots to simulator-screenshots branch
        if: always()
        run: |
          mkdir -p screenshots
          cp RecordSpeed.app.zip screenshots/ || true
          [ -n "$(ls -A screenshots)" ] || { echo "Nothing to publish"; exit 0; }
          cd screenshots
          git init -q -b simulator-screenshots
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Simulator screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" simulator-screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshot
          path: screenshots/
